name: release

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published

jobs:
  test:
    name: Test & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: go vet + test
        run: |
          set -e
          cd go-imp
          go vet ./...
          go test ./...

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build all targets
        run: |
          set -e
          cd go-imp
          mkdir -p ../dist/staging

          # -- 32- & 64-bit x86, x86_64, arm64 ---------------------------------
          for goos in linux windows darwin; do
          for goarch in amd64 arm64 386; do
            case "$goos-$goarch" in
              darwin-386)    continue ;;   # macOS never shipped on 32-bit x86
              windows-arm64) continue ;;   # no windows/arm64 builder in Go 1.21
            esac
            ext=""
            [ "$goos" = "windows" ] && ext=".exe"
            dir="${goos}-${goarch}"
            mkdir -p "../dist/staging/$dir"

            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -ldflags="-s -w" -o "../dist/staging/$dir/tunnel-server${ext}" ./cmd/tunnel-server
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -ldflags="-s -w" -o "../dist/staging/$dir/tunnel-client${ext}" ./cmd/tunnel-client

            cp ../README.md "../dist/staging/$dir/" 2>/dev/null || true
            (cd ../dist/staging && tar czf "../tunnel-${goos}-${goarch}.tar.gz" "$dir")
          done
          done

          # -- arm32 (ARMv7 / ARMv6, e.g. Raspberry Pi) -----------------------
          for goarm in 6 7; do
            dir="linux-armv${goarm}"
            mkdir -p "../dist/staging/$dir"

            GOOS=linux GOARCH=arm GOARM="$goarm" CGO_ENABLED=0 \
              go build -ldflags="-s -w" -o "../dist/staging/$dir/tunnel-server" ./cmd/tunnel-server
            GOOS=linux GOARCH=arm GOARM="$goarm" CGO_ENABLED=0 \
              go build -ldflags="-s -w" -o "../dist/staging/$dir/tunnel-client" ./cmd/tunnel-client

            cp ../README.md "../dist/staging/$dir/" 2>/dev/null || true
            (cd ../dist/staging && tar czf "../tunnel-linux-armv${goarm}.tar.gz" "$dir")
          done

          echo "Built:"
          ls -lh ../dist/tunnel-*.tar.gz
      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tunnel-*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
